<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo CSS # 2</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <section class="galeria">
            <h1>Beautiful, Hand-crafted Layouts</h1>

            <div class="grid-disenos">
                <article class="diseno">
                    <img src="img/real-estate.jpg" alt="Real Estate">
                    <p>Real Estate</p>
                </article>

                <article class="diseno">
                    <img src="img/library.jpg" alt="Library">
                    <p>Library</p>
                </article>

                <article class="diseno">
                    <img src="img/transportation.jpg" alt="Transportation">
                    <p>Transportation</p>
                </article>

                <article class="diseno">
                    <img src="img/gas-oil.jpg" alt="Gas & Oil">
                    <p>Gas &amp; Oil</p>
                </article>

                <article class="diseno">
                    <img src="img/marketing-agency.jpg" alt="Marketing Agency">
                    <p>Marketing Agency</p>
                </article>

                <article class="diseno">
                    <img src="img/pizza.jpg" alt="Pizza">
                    <p>Pizza</p>
                </article>

                <article class="diseno">
                    <img src="img/flooring.jpg" alt="Flooring">
                    <p>Flooring</p>
                </article>

                <article class="diseno">
                    <img src="img/steel-processing.jpg" alt="Steel Processing">
                    <p>Steel Processing</p>
                </article>

                <article class="diseno">
                    <img src="img/coming-soon.jpg" alt="Coming Soon">
                    <p>Coming Soon</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
